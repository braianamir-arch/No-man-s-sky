<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym de a Dos</title>
<meta name="description" content="Rutinas, cargas, pasos, agua, peso, glucosa y suplementos de Braian y Rocío.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E6E0B8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#745A1F" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" id="ios-bar">
<script>
// iPhone: la app se dibuja detrás de la barra de estado (como Samsung Health). En modo claro, letras oscuras.
try { if (matchMedia("(prefers-color-scheme: light)").matches) document.getElementById("ios-bar").content = "default"; } catch (e) {}
</script>
<meta name="apple-mobile-web-app-title" content="Gym de a Dos">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap">
<style>
/* Layout: estilo Samsung Health. Columna de 640px; arriba título + barra de secciones con íconos; tarjetas de color vivo con ilustración en la esquina y tarjetas neutras para datos; píldora de navegación flotante y botón redondo de registro.
   Claro: degradé pastel menta→durazno con tarjetas de vidrio lechoso. Oscuro: verde casi negro con brillo dorado arriba, como la app. */
:root{
  --bg:#EAF3EF; --bg-a:#CDEBDF; --bg-b:#FBE4D4; --glow:rgba(255,214,140,.55); --top:#E6E0B8;
  --card:rgba(255,255,255,.52); --card-line:rgba(255,255,255,.7); --card-in:rgba(255,255,255,.55); --edge:rgba(255,255,255,.95); --edge-2:rgba(255,255,255,.25);
  --fill:rgba(20,40,32,.06); --fill-2:rgba(20,40,32,.10); --line:rgba(20,40,32,.08);
  --sheet:rgba(247,251,249,.96); --scrim:rgba(10,20,16,.32); --dock:rgba(255,255,255,.78);
  --ink:#13211C; --ink-2:#536460; --ink-3:#8A9893;
  --braian:#16917A; --rocio:#D9557A; --accent:var(--braian); --on-accent:#FFFFFF;
  --ring-steps:#7FD13B; --ring-water:#22B8E6; --ring-train:#9B6BF2; --hot:#E5483A; --on-ring:#0B1410;
  --v-blue:#2F63D3; --v-orange:#D2611F; --v-cyan:#0A93C6; --v-coral:#C95E3E; --v-purple:#7B55C4; --v-mustard:#B9841F; --v-teal:#118C78; --v-rose:#C24F6A; --v-black:#1A1A21;
  --vivid-ink:#FFFFFF; --vivid-2:rgba(255,255,255,.82); --vivid-chip:rgba(255,255,255,.22); --vivid-btn:rgba(255,255,255,.24);
  --good:#15804C; --warn:#A5620B; --bad:#C2281C;
  --p25:#D2232A; --p20:#1D58CC; --p15:#E6B417; --p10:#23905A; --p5:#FAFAFA; --psm:#6A7280; --p-ink:#FFFFFF; --p-ink-dark:#1A1A1A;
  --shadow:0 10px 30px -10px rgba(40,70,60,.18);
  --f-display:"Outfit","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-lg:22px; --r:18px; --r-sm:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#18211E; --bg-a:#2C2918; --bg-b:#101614; --glow:rgba(168,124,34,.62); --top:#745A1F;
    --card:rgba(42,50,47,.34); --card-line:rgba(255,255,255,.07); --card-in:rgba(255,255,255,.07); --edge:rgba(255,255,255,.36); --edge-2:rgba(255,255,255,.04);
    --fill:rgba(255,255,255,.07); --fill-2:rgba(255,255,255,.13); --line:rgba(255,255,255,.08);
    --sheet:rgba(24,28,27,.97); --scrim:rgba(0,0,0,.55); --dock:rgba(34,38,37,.92);
    --ink:#F1F4F2; --ink-2:#A9B3AF; --ink-3:#77827E;
    --braian:#5ED6B4; --rocio:#FF8FB1; --on-accent:#08130F;
    --ring-steps:#B6F04A; --ring-water:#3FD3F0; --ring-train:#B07BFF; --hot:#FF6A55;
    --good:#4ADE94; --warn:#F2B84B; --bad:#FF7A6E;
    --p25:#E0464C; --p20:#4A7DE6; --p15:#E8BE3A; --p10:#3BAA6E; --p5:#E9EBEF; --psm:#7C8494;
    --shadow:0 18px 40px -18px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#18211E; --bg-a:#2C2918; --bg-b:#101614; --glow:rgba(168,124,34,.62); --top:#745A1F;
  --card:rgba(42,50,47,.34); --card-line:rgba(255,255,255,.07); --card-in:rgba(255,255,255,.07); --edge:rgba(255,255,255,.36); --edge-2:rgba(255,255,255,.04);
  --fill:rgba(255,255,255,.07); --fill-2:rgba(255,255,255,.13); --line:rgba(255,255,255,.08);
  --sheet:rgba(24,28,27,.97); --scrim:rgba(0,0,0,.55); --dock:rgba(34,38,37,.92);
  --ink:#F1F4F2; --ink-2:#A9B3AF; --ink-3:#77827E;
  --braian:#5ED6B4; --rocio:#FF8FB1; --on-accent:#08130F;
  --ring-steps:#B6F04A; --ring-water:#3FD3F0; --ring-train:#B07BFF; --hot:#FF6A55;
  --good:#4ADE94; --warn:#F2B84B; --bad:#FF7A6E;
  --p25:#E0464C; --p20:#4A7DE6; --p15:#E8BE3A; --p10:#3BAA6E; --p5:#E9EBEF; --psm:#7C8494;
  --shadow:0 18px 40px -18px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.45;
  padding-left:max(12px, env(safe-area-inset-left, 0px)); padding-right:max(12px, env(safe-area-inset-right, 0px)); padding-block:0;
  -webkit-tap-highlight-color:transparent}
#app[data-person="rocio"]{--accent:var(--rocio)}
.bgfx{position:fixed; inset:0; z-index:0; pointer-events:none;
  background:linear-gradient(180deg, var(--top) 0px, color-mix(in srgb, var(--top) 0%, transparent) 150px),
    radial-gradient(140% 40% at 50% -6%, var(--glow) 0%, transparent 74%),
    radial-gradient(70% 38% at -10% 48%, color-mix(in srgb, var(--accent) 16%, transparent) 0%, transparent 70%),
    radial-gradient(70% 36% at 110% 78%, rgba(124,92,230,.13) 0%, transparent 70%),
    linear-gradient(180deg, var(--bg-a) 0%, var(--bg) 42%, var(--bg-b) 100%)}
.wrap{position:relative; z-index:1; max-width:640px; margin:0 auto; padding-bottom:calc(96px + env(safe-area-inset-bottom, 0px))}
button{font:inherit; color:inherit; cursor:pointer}
button:disabled,input:disabled,select:disabled,textarea:disabled{cursor:not-allowed; opacity:.5}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
.g{position:relative; background:linear-gradient(165deg, color-mix(in srgb, var(--card) 100%, rgba(255,255,255,.06)) 0%, var(--card) 60%); -webkit-backdrop-filter:blur(28px) saturate(180%); backdrop-filter:blur(28px) saturate(180%); border:1px solid var(--card-line); border-radius:var(--r-lg); box-shadow:inset 0 1px 0 var(--edge-2), var(--shadow)}
/* borde de luz: más brillante arriba a la izquierda, como el vidrio de Samsung */
.g::after{content:""; position:absolute; inset:-1px; border-radius:inherit; padding:1px; pointer-events:none;
  background:linear-gradient(150deg, var(--edge) 0%, var(--edge-2) 38%, transparent 62%, var(--edge-2) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask:linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0)}
.stack{display:grid; gap:12px}
.card{padding:16px 18px; display:grid; gap:12px; min-width:0}
.card h2{font-family:var(--f-body); font-weight:600; font-size:16px}
.eyebrow{font-size:13px; font-weight:600; color:var(--ink-2)}
.small{font-size:13px; color:var(--ink-2)}
.muted{color:var(--ink-2)}
.ib{border:0; background:var(--fill); width:40px; height:40px; border-radius:50%; display:grid; place-items:center; flex-shrink:0}
.ib svg{width:20px; height:20px}
svg.i{fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.pillbtn{border:0; background:var(--fill-2); border-radius:999px; padding:11px 20px; font-weight:600; font-size:15px; white-space:nowrap}
.pillbtn.acc{background:var(--accent); color:var(--on-accent)}
.ghost{border:1px solid var(--line); background:var(--fill); border-radius:999px; padding:8px 14px; font-size:13.5px; font-weight:600}
.danger-btn{border:1px solid var(--bad); color:var(--bad); background:transparent; border-radius:999px; padding:8px 14px; font-weight:600; font-size:13.5px}
.chip{display:inline-flex; align-items:center; font-size:12px; font-weight:700; border-radius:999px; padding:3px 10px; white-space:nowrap; background:var(--fill)}
.chip.good{background:color-mix(in srgb, var(--good) 18%, transparent); color:var(--good)}
.chip.warn{background:color-mix(in srgb, var(--warn) 18%, transparent); color:var(--warn)}
.chip.bad{background:color-mix(in srgb, var(--bad) 18%, transparent); color:var(--bad)}
.confirm{display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-size:13.5px; background:var(--fill); border-radius:var(--r-sm); padding:10px 12px}
.confirm span{flex:1 1 180px}
.empty{padding:24px 16px; text-align:center; color:var(--ink-2)}
.empty b{display:block; color:var(--ink); margin-bottom:4px}

/* Encabezado */
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:18px 16px}
.title{font-family:var(--f-display); font-weight:600; font-size:23px; letter-spacing:-.01em; line-height:1.15}
.sub{font-size:12.5px; color:var(--ink-2); margin-top:2px}
.sub b{color:var(--ink); font-weight:600}
.sub [data-s="saving"]{color:var(--warn)} .sub [data-s="error"]{color:var(--bad)}
.p-braian{--pc:var(--braian)} .p-rocio{--pc:var(--rocio)}
.whoball{border:0; background:none; padding:0 0 6px; position:relative; display:grid; justify-items:center; flex-shrink:0}
.ring{display:grid; place-items:center; width:36px; height:36px; border-radius:50%; padding:2.5px; background:conic-gradient(from 200deg, var(--pc), color-mix(in srgb, var(--pc) 30%, #FFFFFF), var(--pc) 70%)}
.av{width:100%; height:100%; border-radius:50%; display:grid; place-items:center; font-family:var(--f-display); font-weight:700; font-size:15px; color:var(--on-accent); background:var(--pc); box-shadow:0 0 0 2px var(--bg)}
.black{display:inline-block; font-family:var(--f-display); font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#F3D58A; background:linear-gradient(180deg, #2A2A33, #0E0E12); border:1px solid rgba(243,213,138,.5); border-radius:999px; padding:2px 8px; box-shadow:0 0 14px rgba(243,213,138,.28); line-height:1.3}
.whoball .black{position:absolute; bottom:0; font-size:7.5px; padding:0 5px; letter-spacing:.06em}
/* panel de perfil, como el selector de cuentas de Gmail */
.pm{position:fixed; z-index:22; top:calc(env(safe-area-inset-top, 0px) + 66px); right:max(12px, env(safe-area-inset-right, 0px)); width:min(380px, calc(100vw - 24px)); max-height:calc(100dvh - env(safe-area-inset-top, 0px) - 96px); overflow-y:auto; padding:16px; display:grid; gap:12px; border-radius:28px}
.pm.g{background:color-mix(in srgb, var(--sheet) 82%, transparent)}
.pm-head{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:14px; align-items:center}
.pm-head .ring{width:66px; height:66px; padding:4px}
.pm-head .av{font-size:26px; box-shadow:0 0 0 3px var(--bg)}
.pm-head h2{font-family:var(--f-display); font-weight:600; font-size:23px; line-height:1.1; margin-bottom:6px}
.pm-sec{background:var(--card-in); border-radius:20px; padding:12px 14px; display:grid; gap:7px}
.pm-sec h3{font-family:var(--f-body); font-size:14px; font-weight:700}
.pm-row{display:flex; justify-content:space-between; gap:12px; font-size:14px}
.pm-row span{color:var(--ink-2)} .pm-row b{font-weight:600; text-align:right; font-variant-numeric:tabular-nums}
.pm-other{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center; border:0; background:var(--card-in); border-radius:20px; padding:10px 12px; text-align:left; width:100%}
.pm-other .ring{width:44px; height:44px; padding:2.5px} .pm-other .av{font-size:17px}
.pm-other small{display:block; color:var(--ink-2); font-size:12.5px}
@media (prefers-reduced-motion: no-preference){ .pm{animation:pmin .22s cubic-bezier(.2,.8,.2,1); transform-origin:top right} @keyframes pmin{from{opacity:0; transform:scale(.94) translateY(-6px)}to{opacity:1; transform:none}} }
.banner{padding:12px 14px; font-size:13.5px; margin-bottom:12px; border-left:4px solid var(--warn)}
.banner[data-k="bad"]{border-left-color:var(--bad)}
#app[data-mode="login"] .dock,#app[data-mode="login"] .whoball{display:none}
label.ghost{display:inline-flex; align-items:center}

/* Barra de secciones con íconos (como la fila de íconos de Samsung Health) */
.secbar{display:flex; padding:3px; border-radius:999px; gap:0; position:sticky; top:calc(6px + env(safe-area-inset-top, 0px)); z-index:6; margin-bottom:12px; overflow-x:auto; scrollbar-width:none}
.secbar::-webkit-scrollbar{display:none}
.secbar:empty{display:none}
.secbar button{flex:1 0 40px; min-width:40px; height:40px; border:0; background:transparent; border-radius:999px; display:grid; place-items:center; color:var(--ink-2)}
.secbar button svg{width:22px; height:22px; stroke-width:1.6}
.secbar.g{background:color-mix(in srgb, var(--card) 45%, transparent)}
.secbar button[aria-current="page"]{background:var(--fill-2); color:var(--ink)}
.secbar button[aria-current="page"] svg{stroke-width:2.2}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--top)}
.sechead{display:grid; gap:6px; padding:8px 6px 4px}
.sechead h2{font-family:var(--f-display); font-weight:600; font-size:26px; line-height:1.15}
.sechead p{font-size:16px; color:var(--ink-2); line-height:1.45; max-width:58ch}

/* Navegación inferior */
.dock{position:fixed; left:0; right:0; bottom:0; z-index:8; display:flex; justify-content:flex-end; align-items:center; gap:10px; pointer-events:none;
  padding-left:max(12px, env(safe-area-inset-left, 0px)); padding-right:max(12px, env(safe-area-inset-right, 0px)); padding-bottom:calc(14px + env(safe-area-inset-bottom, 0px))}
.dock > *{pointer-events:auto}
.fab{width:56px; height:56px; border-radius:50%; display:grid; place-items:center; flex-shrink:0; border:1px solid var(--card-line); background:var(--dock); -webkit-backdrop-filter:blur(24px); backdrop-filter:blur(24px); box-shadow:0 10px 30px rgba(0,0,0,.12)}
.fab svg{width:24px; height:24px}

/* Fecha */
.datebar{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:3px; border-radius:999px}
.datebar .ib{width:34px; height:34px; background:transparent} .datebar .ib svg{width:18px; height:18px}
.dlabel{position:relative; flex:1; text-align:center; font-size:14.5px; padding:6px 4px; border-radius:999px}
.dlabel b{font-weight:700}
.dlabel input{position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer}

/* Carrusel de resumen */
.hero{overflow:hidden}
.slides{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%; scroll-snap-align:start; padding:26px 20px 6px; display:grid; gap:12px; align-content:start}
.slide h2{font-family:var(--f-display); font-weight:600; font-size:23px; line-height:1.45}
.slide p{font-size:16px; color:color-mix(in srgb, var(--ink) 86%, transparent); line-height:1.45}
.slide .act{display:flex; justify-content:flex-end; padding-top:2px}
.slide .act .pillbtn{background:color-mix(in srgb, var(--ink) 16%, transparent); padding:10px 18px; font-size:15.5px}
.wdots{display:flex; gap:8px; flex-wrap:wrap}
.wdots span{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-2); background:var(--fill); border-radius:999px; padding:5px 10px}
.wdots span i{width:9px; height:9px; border-radius:50%; background:var(--fill-2)}
.wdots span.on{color:var(--ink)} .wdots span.on i{background:var(--good)}
.dots{display:flex; justify-content:center; gap:7px; padding:6px 0 18px}
.dots i{width:7px; height:7px; border-radius:99px; background:var(--fill-2); transition:width .2s ease, background-color .2s ease}
.dots i.on{width:22px; background:var(--ink)}

/* Tarjetas de color (como las de Samsung Health) */
.vc{position:relative; overflow:hidden; border-radius:var(--r-lg); background:var(--vc, var(--v-blue)); color:var(--vivid-ink); padding:16px 18px; display:grid; gap:8px; align-content:space-between; min-height:158px; min-width:0; text-align:left; border:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.30), inset 0 -1px 0 rgba(0,0,0,.12), 0 16px 34px -18px var(--vc, var(--v-blue))}
.vc::before{content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(120% 90% at 0% 0%, rgba(255,255,255,.22) 0%, transparent 55%), radial-gradient(80% 70% at 100% 110%, rgba(0,0,0,.18) 0%, transparent 60%)}
.vc > *{position:relative; z-index:1}
.vc .art{position:absolute; z-index:0; right:-12px; top:-12px; width:118px; height:118px; pointer-events:none}
.vc .art svg{width:100%; height:100%; display:block; overflow:visible; filter:drop-shadow(0 14px 14px rgba(0,0,0,.28))}
.vc h3{font-family:var(--f-body); font-weight:500; font-size:15.5px; padding-right:84px}
.vc .bot{display:grid; gap:4px}
.vc .v{font-family:var(--f-display); font-weight:600; font-size:32px; line-height:1; font-variant-numeric:tabular-nums}
.vc .v small{font-family:var(--f-body); font-size:14px; font-weight:500; color:var(--vivid-2); margin-left:4px}
.vc .s{font-size:14.5px; color:var(--vivid-2); line-height:1.4}
.vc .lead{font-size:16.5px; line-height:1.4}
.vc .chip{background:var(--vivid-chip); color:var(--vivid-ink)}
.vc .spark path{stroke:var(--vivid-ink)} .vc .spark circle{fill:var(--vivid-ink)}
.vc.tap{cursor:pointer}
.vc.wide{min-height:164px}
.vbtns{display:flex; gap:8px; flex-wrap:wrap}
.vbtns button{border:0; border-radius:999px; padding:10px 16px; font-weight:600; background:var(--vivid-btn); color:var(--vivid-ink)}
.vbtns button.primary{flex:1; background:var(--vivid-ink); color:var(--vc, var(--v-blue))}

/* Tarjetas neutras de datos */
.tiles{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px}
.span2{grid-column:1 / -1}
.tile{padding:16px; display:grid; gap:6px; align-content:start; text-align:left; min-width:0; cursor:pointer; color:var(--ink); min-height:158px}
.tile h3{font-family:var(--f-body); font-weight:500; font-size:15.5px}
.heart{display:flex; justify-content:center; align-items:center; flex:1}
.heart svg{width:106px; height:98px}
.act-big{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center}
.arows{display:grid; gap:10px}
.arow{display:flex; align-items:center; gap:10px; font-variant-numeric:tabular-nums}
.arow .ic{width:30px; height:30px; border-radius:50%; display:grid; place-items:center; flex-shrink:0; color:var(--on-ring)}
.arow .ic svg{width:17px; height:17px}
.arow b{font-family:var(--f-display); font-weight:600; font-size:27px; line-height:1}
.arow span{font-size:15px; color:var(--ink-2)}
.spark{width:100%; height:40px}
.spark path{fill:none; stroke:var(--accent); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round}
.spark circle{fill:var(--accent)}
.week{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:14px; align-items:end}
.week .bignum{font-size:46px; font-weight:700}
.wk{display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:4px; align-items:end; height:92px}
.wk span{display:grid; justify-items:center; gap:8px; align-content:end; height:100%}
.wk span i{display:block; width:9px; border-radius:99px; background:var(--ring-water)}
.wk span i.plan{background:var(--fill-2)}

.supp{display:flex; align-items:center; gap:10px; border:0; background:var(--fill); border-radius:var(--r-sm); padding:9px 10px; text-align:left; width:100%}

.grid2{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px}
.tin{font:inherit; color:var(--ink); background:var(--fill); border:1.5px solid transparent; border-radius:12px; padding:10px 12px; width:100%; min-width:0; min-height:44px}
.tin:focus{outline:none; border-color:var(--accent)}
select.tin{appearance:auto}
.switch{display:flex; align-items:center; gap:10px; font-size:14px; font-weight:600}
.switch input{width:20px; height:20px; accent-color:var(--accent)}

/* Hoja de registro */
.scrim{position:fixed; inset:0; z-index:20; background:var(--scrim)}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:21; max-height:88vh; max-height:88dvh; overflow-y:auto; background:var(--sheet);
  -webkit-backdrop-filter:blur(30px); backdrop-filter:blur(30px); border-radius:28px 28px 0 0; border-top:1px solid var(--card-line);
  padding-top:8px; padding-bottom:calc(22px + env(safe-area-inset-bottom, 0px)); padding-left:max(12px, env(safe-area-inset-left, 0px)); padding-right:max(12px, env(safe-area-inset-right, 0px))}
.sheet .in{max-width:640px; margin:0 auto; display:grid; gap:18px}

.sh-h{display:flex; justify-content:space-between; align-items:center; gap:10px}
.sh-h h2{font-family:var(--f-display); font-weight:600; font-size:22px}

.sec h3{font-family:var(--f-display); font-weight:600; font-size:16px}
.ctxs{display:flex; flex-wrap:wrap; gap:6px}
.ctxs button{border:1px solid var(--line); background:var(--fill); border-radius:999px; padding:7px 12px; font-size:13px; font-weight:600}

.advice{font-size:13.5px; border-radius:var(--r-sm); padding:10px 12px; background:var(--fill)}
.advice.good{background:color-mix(in srgb, var(--good) 14%, transparent)}
.advice.warn{background:color-mix(in srgb, var(--warn) 14%, transparent)}
.advice.bad{background:color-mix(in srgb, var(--bad) 14%, transparent)}

.ssline{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; font-size:13px; color:var(--ink-2); background:color-mix(in srgb, var(--accent) 10%, transparent); border-radius:12px; padding:8px 10px}

.row{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
.row2{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:center}

.bignum small{font-family:var(--f-body); font-size:14px; font-weight:500; color:var(--ink-2); margin-left:4px}

/* Progreso */
.seg{display:flex; padding:5px; border-radius:999px; gap:4px}
.seg button{flex:1; border:0; background:transparent; border-radius:999px; padding:10px; font-weight:600; color:var(--ink-2)}

.goal-l{stroke:var(--ink-3); stroke-width:1.2; stroke-dasharray:4 4}
.low-l{stroke:var(--bad); stroke-width:1.2; stroke-dasharray:3 4}

.pt{fill:var(--ink-2); opacity:.45}
.avg{fill:none; stroke:var(--accent); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round}
.end{fill:var(--accent); stroke:var(--card-in); stroke-width:2}
.bar-ok{fill:var(--accent)} .bar-lo{fill:var(--accent); opacity:.35}
.gp.good{fill:var(--good)} .gp.warn{fill:var(--warn)} .gp.bad{fill:var(--bad)}
.tiles2{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px}
.mini{padding:16px 18px; display:grid; gap:4px; min-width:0}

.mini .s{font-size:12.5px; color:var(--ink-2)}
.plist{display:grid}
.prow{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; padding:10px 0; border-top:1px solid var(--line); font-size:14px}
.prow:first-child{border-top:0}
.prow .d{font-weight:600}
.prow .vol{font-size:12.5px; color:var(--ink-2); text-align:right; font-variant-numeric:tabular-nums}
.prow .ss{grid-column:1 / -1; color:var(--ink-2); font-size:13px; font-variant-numeric:tabular-nums}

/* Ajustes */
details.rday{padding:0}
details.rday > summary{list-style:none; cursor:pointer; padding:16px 18px; display:flex; justify-content:space-between; align-items:center; gap:10px}

details.rday[open] > summary svg{transform:rotate(180deg)}
.rbody{padding:0 18px 16px; display:grid; gap:10px}
.rdh{display:grid; grid-template-columns:100px minmax(0,1fr); gap:8px}
.rdh .wide{grid-column:1 / -1}
.rex{border-top:1px solid var(--line); padding-top:10px; display:grid; gap:8px}
.rexrow{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,.7fr) minmax(0,1fr); gap:8px}
.rexrow.four{grid-template-columns:minmax(0,1.4fr) minmax(0,.6fr) minmax(0,.9fr) minmax(0,.7fr)}

.supp-ed{border-top:1px solid var(--line); padding-top:10px; display:grid; gap:8px}

.copyrow{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:center}
.copyrow code{font-size:12.5px; background:var(--fill); border-radius:12px; padding:10px 12px; overflow-wrap:anywhere; user-select:all}

}
</style>
</head>

        <label class="lbl" for="glu-post">2 h después, máximo<span class="fld"><input id="glu-post" type="text" inputmode="numeric" data-f="glu-post" value="${prof.glu.post}"><span class="u">mg/dL</span></span></label>
        <label class="lbl" for="glu-low">Baja por debajo de<span class="fld"><input id="glu-low" type="text" inputmode="numeric" data-f="glu-low" value="${prof.glu.low}"><span class="u">mg/dL</span></span></label>
      </div><p class="small">Vienen con los valores generales de la ADA. Si el médico indicó otros, usá esos.</p>` : ""}</section>
    <h2 style="font-family:var(--f-display);font-weight:600;font-size:20px;padding:6px 4px 0">Rutina</h2>
    <p class="small" style="padding:0 4px">Los cambios se guardan solos. Cambiar un nombre no borra el historial del ejercicio.</p>
    ${days}
    <div class="exf"><button type="button" class="ghost" data-act="rt-add-day" data-write>+ Agregar día</button>${custom ? `<button type="button" class="danger-btn" data-act="rt-reset" data-write>Restaurar rutina original</button>` : ""}</div>
    ${resetConf}
  </div>`;
}
function stepsSettings(p) {
  const copyRow = (id, v) => `<div class="copyrow"><code id="${id}">${esc(v)}</code><button type="button" class="ghost" data-act="copy" data-src="${id}" data-free>Copiar</button></div>`;
  const app = stepsApp();
  let body = `<p class="small">${isIOS() ? "El iPhone puede mandar los pasos de Salud a la app solo, todas las noches, con la app Atajos." : "Ninguna app web puede leer Samsung Health. Lo más rápido: tocá el botón, mirá el número y escribilo en el cuadro de pasos, que se abre solo al volver."}</p><div class="exf">${stepsAppBtn("ghost")}</div>`;
  if (S.mode !== "db") return `<section class="card g"><h2>Pasos</h2>${body}<p class="small">Los pasos automáticos del iPhone necesitan la cuenta compartida.</p></section>`;
  const tok = S.docs["settings/steps"] && S.docs["settings/steps"].token;
  body += `<h3 style="font-size:15px;margin-top:4px">Pasos automáticos desde el iPhone</h3>`;
  if (!tok) return `<section class="card g"><h2>Pasos</h2>${body}<p class="small">Primero creá una clave. Sirve para que el atajo pueda guardar pasos sin iniciar sesión, y solo eso.</p><div><button type="button" class="pillbtn acc" data-act="steps-token" data-write>Crear clave del atajo</button></div></section>`;
  return `<section class="card g"><h2>Pasos</h2>${body}
    <ol class="how"><li>Abrí <b>Atajos</b> → pestaña <b>Automatización</b> → <b>Nueva automatización</b> → <b>Hora del día</b>: 23:00, <b>Diariamente</b>, y elegí <b>Ejecutar inmediatamente</b>.</li>
      <li>Agregá <b>Buscar muestras de Salud</b>: tipo <b>Pasos</b>, fecha de inicio <b>hoy</b>.</li>
      <li>Agregá <b>Calcular estadísticas</b> con <b>Suma</b>, y después <b>Redondear número</b>.</li>
      <li>Agregá <b>Obtener contenido de URL</b> con esta dirección:</li></ol>
    ${copyRow("st-url", (window.GYM_CONFIG || {}).supabaseUrl + "/rest/v1/rpc/registrar_pasos")}
    <ol class="how" start="5"><li>Tocá <b>Mostrar más</b>: método <b>POST</b>. En <b>Encabezados</b> agregá <b>apikey</b> con este valor:</li></ol>
    ${copyRow("st-key", (window.GYM_CONFIG || {}).supabaseAnonKey || "")}
    <ol class="how" start="6"><li>En <b>Cuerpo de la solicitud</b> elegí <b>JSON</b> y agregá tres campos: <b>clave</b> (texto) con este valor,</li></ol>
    ${copyRow("st-tok", tok)}
    <ol class="how" start="7"><li><b>persona</b> (texto): <b>${p}</b>, y <b>pasos</b> (número): el <b>Número redondeado</b>.</li><li>Tocá ▶ para probarlo: los pasos aparecen en la app al instante.</li></ol>
    <p class="small">Con el iPhone bloqueado, iOS a veces no deja leer Salud y el atajo falla esa noche: elegí un horario en que suela usar el teléfono. Si usa Apple Watch, filtrá las muestras para que el origen sea solo el iPhone, así no se cuentan dos veces.</p></section>`;
}
function routineEdit(fn) {
  const p = S.person, R = clone(routine(p));
  if (fn(R) === false) return;
  writeDoc("routines/" + p, { days: R.days, updated: Date.now() }, 500);
}
function editRoutineField(t) {
  const dayEl = t.closest("[data-day]"); if (!dayEl) return;
  const f = t.dataset.f, val = t.value;
  routineEdit(R => {
    const d = R.days.find(x => x.id === dayEl.dataset.day); if (!d) return false;
    if (f === "rt-label") d.label = val;
    else if (f === "rt-focus") d.focus = val;
    else if (f === "rt-wd") d.wd = val === "" ? null : +val;
    else {
      const exEl = t.closest("[data-exk]"), ex = exEl && d.ex.find(x => x.key === exEl.dataset.exk); if (!ex) return false;
      if (f === "rt-name") ex.name = val;
      else if (f === "rt-type") ex.type = val;
      else if (f === "rt-sets") { const n = parseInt(val, 10); if (!(n >= 1 && n <= 12)) return false; ex.sets = n; }
      else if (f === "rt-reps") ex.reps = val;
      else if (f === "rt-note") ex.note = val;
      else if (f === "rt-ss") { const v = val.trim().toUpperCase(); if (v) ex.ss = v; else delete ex.ss; }
      else if (f === "rt-bar") { const n = parseNum(val); if (n == null || n < 0) return false; ex.bar = n; }
    }
  });
}
function routineAction(a, btn) {
  const dayEl = btn.closest("[data-day]"), exEl = btn.closest("[data-exk]");
  if (a === "rt-add-day") { const id = "d" + uid(); routineEdit(R => { R.days.push({ id, wd: null, label: "Nuevo día", focus: "", ex: [] }); }); S.openDays.add(id); render(); const el = document.getElementById("rl-" + id); if (el) { el.focus(); el.select(); } return; }
  if (a === "rt-reset") { S.confirm = "reset"; render(); return; }
  if (!dayEl) return;
  const dayId = dayEl.dataset.day;
  if (a === "rt-del-day") { S.confirm = "del-day:" + dayId; render(); return; }
  if (a === "rt-add") { const key = "x" + uid(); routineEdit(R => { const d = R.days.find(x => x.id === dayId); if (!d) return false; d.ex.push(E(key, "Nuevo ejercicio", "maquina", 3, "10-12")); }); S.openDays.add(dayId); render(); const el = document.getElementById(`rn-${dayId}-${key}`); if (el) { el.focus(); el.select(); } return; }
  if (!exEl) return;
  const key = exEl.dataset.exk;
  routineEdit(R => { const d = R.days.find(x => x.id === dayId); if (!d) return false; const i = d.ex.findIndex(x => x.key === key); if (i < 0) return false;
    if (a === "rt-del") d.ex.splice(i, 1);
    if (a === "rt-up" && i > 0) [d.ex[i - 1], d.ex[i]] = [d.ex[i], d.ex[i - 1]];
    if (a === "rt-down" && i < d.ex.length - 1) [d.ex[i + 1], d.ex[i]] = [d.ex[i], d.ex[i + 1]]; });
  render();
}
function suppField(t) {
  const el = t.closest("[data-sid]"); if (!el) return;
  const id = el.dataset.sid, f = t.dataset.f;
  profileEdit(pr => { const s = pr.supps.find(x => x.id === id); if (!s) return false;
    if (f === "sp-name") s.name = t.value; else if (f === "sp-dose") s.dose = t.value; else if (f === "sp-when") s.when = t.value; else if (f === "sp-active") s.active = t.checked; });
}
function confirmYes() {
  const c = S.confirm || ""; S.confirm = null;
  if (c === "del-sess") removeDoc(sessPath(S.person, S.date, curDay().id));
  else if (c === "reset") removeDoc("routines/" + S.person);
  else if (c.startsWith("del-day:")) { const id = c.slice(8); routineEdit(R => { R.days = R.days.filter(d => d.id !== id); }); }
  render();
}
function addGlucose(v, t, ctx) {
  const prof = profile(S.person);
  editDaily(S.person, S.date, d => { d.glucose = (d.glucose || []).concat([{ id: uid(), t, v, ctx }]).sort((a, b) => a.t < b.t ? -1 : 1); }, 200);
  const st = ctx === "pre" ? preAdvice(v) : gluStatus(v, ctx, prof.glu);
  toast(`Glucosa ${v} mg/dL guardada · ${st.short || st.txt}`);
}

/* ---------- Eventos ---------- */
function bind() {
  const app = $("#app");
  app.addEventListener("click", e => {
    if (e.target.id === "date-pick") { try { e.target.showPicker(); } catch (err) {} return; }
    const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
    const a = b.dataset.act;
    const ae = document.activeElement; if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && ae.type !== "checkbox") ae.blur();
    if (a === "profile") { S.menu = !S.menu; render(); }
    else if (a === "profile-close") { S.menu = false; render(); }
    else if (a === "person") { S.person = b.dataset.p; S.menu = false; S.confirm = null; S.slide = 0; S.gluDraft = ""; S.preDraft = ""; saveUI(); render(); window.scrollTo(0, 0); }
    else if (a === "tab") { S.tab = b.dataset.t; S.confirm = null; saveUI(); render(); window.scrollTo(0, 0); }
    else if (a === "sec") { S.sec = b.dataset.k; S.tab = "home"; S.slide = 0; saveUI(); render(); window.scrollTo(0, 0); }
    else if (a === "date") { const n = addDays(S.date, +b.dataset.d); if (n <= today()) { S.date = n; S.confirm = null; S.slide = 0; render(); } }
    else if (a === "day") { S.day[S.person] = b.dataset.id; S.confirm = null; render(); }
    else if (a === "go-train") { if (b.dataset.id) S.day[S.person] = b.dataset.id; S.tab = "train"; saveUI(); render(); window.scrollTo(0, 0); }
    else if (a === "sheet") { S.sheet = b.dataset.s || "all"; S.gluTime = ""; renderSheet(); const f = $("#sheet input"); if (f && S.sheet === "steps") setTimeout(() => f.focus(), 80); }
    else if (a === "sheet-close") { S.sheet = null; if (document.activeElement) document.activeElement.blur(); render(); }
    else if (a === "water") { const prof = profile(S.person), step = +b.dataset.d * (prof.bottle || 1); editDaily(S.person, S.date, d => { d.water = Math.max(0, Math.round(((d.water || 0) + step) * 100) / 100); if (!d.water) delete d.water; }, 400); render(); }
    else if (a === "supp") { const id = b.dataset.id; editDaily(S.person, S.date, d => { d.supps = Object.assign({}, d.supps); if (d.supps[id]) delete d.supps[id]; else d.supps[id] = true; }, 300); render(); }
    else if (a === "glu-ctx") { S.gluCtx = b.dataset.c; renderSheet(); }
    else if (a === "glu-add") { const v = parseInt0(S.gluDraft); if (v == null || v < 20 || v > 600) { toast("Escribí un valor entre 20 y 600 mg/dL"); return; } const ctx = S.gluCtx || (parseInt(nowHM(), 10) < 10 ? "fast" : "meal"); addGlucose(v, S.gluTime || nowHM(), ctx); S.gluDraft = ""; S.gluTime = ""; render(); }
    else if (a === "glu-pre") { const v = parseInt0(S.preDraft); if (v == null || v < 20 || v > 600) { toast("Escribí un valor entre 20 y 600 mg/dL"); return; } addGlucose(v, nowHM(), "pre"); S.preDraft = ""; render(); }
    else if (a === "glu-del") { const id = b.dataset.id; editDaily(S.person, S.date, d => { d.glucose = (d.glucose || []).filter(g => g.id !== id); if (!d.glucose.length) delete d.glucose; }, 200); render(); }
    else if (a === "add-set" || a === "rm-set" || a === "repeat") exAction(a, b.dataset.ex);
    else if (a === "del-sess") { S.confirm = "del-sess"; render(); }
    else if (a === "finish") {
      const p = S.person, day = curDay(), path = sessPath(p, S.date, day.id), s = sessForEdit(path, p, day), on = b.dataset.v === "1";
      if (on) { s.done = true; s.doneAt = Date.now(); } else { delete s.done; delete s.doneAt; }
      s.dayLabel = day.label; s.updated = Date.now(); writeDoc(path, s, 150);
      if (on) toast(`${day.label} realizada ✓`);
      render(); if (on) window.scrollTo(0, 0);
    }
    else if (a === "confirm-yes") confirmYes();
    else if (a === "confirm-no") { S.confirm = null; render(); }
    else if (a === "prog-mode") { S.progMode = b.dataset.m; render(); }
    else if (a === "sp-add") { const id = "s" + uid(); profileEdit(pr => { pr.supps = pr.supps.concat([{ id, name: "Nuevo suplemento", dose: "", when: "Día", active: true }]); }); render(); const el = document.getElementById("sn-" + id); if (el) { el.focus(); el.select(); } }
    else if (a === "sp-del") { const id = b.closest("[data-sid]").dataset.sid; profileEdit(pr => { pr.supps = pr.supps.filter(s => s.id !== id); }); render(); }
    else if (a === "install") { if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); } }
    else if (a === "install-hide") { try { localStorage.setItem("gym-de-a-dos:hide-install", "1"); } catch (err) {} render(); }
    else if (a === "export") exportData();
    else if (a === "open-steps") { S.awaitSteps = true; }
    else if (a === "steps-token") {
      const r = new Uint8Array(16); crypto.getRandomValues(r);
      writeDoc("settings/steps", { token: Array.from(r, x => x.toString(16).padStart(2, "0")).join(""), updated: Date.now() }, 100);
      toast("Clave creada"); render();
    }
    else if (a === "logout") { if (SB) SB.auth.signOut(); }
    else if (a === "copy") { const src = document.getElementById(b.dataset.src || "sc-link"); if (!src) return; const txt = src.textContent; const done = () => toast("Copiado");
      const fallback = () => { const r = document.createRange(); r.selectNodeContents(src); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Seleccionado: copialo con el menú del teléfono"); };
      try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (err) { fallback(); } }
    else if (a.startsWith("rt-")) routineAction(a, b);
  });
  app.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
    if (e.key === "Escape" && S.menu) { S.menu = false; render(); }
    else if (e.key === "Escape" && S.sheet) { S.sheet = null; render(); }
  });
  app.addEventListener("input", e => {
    const t = e.target, f = t.dataset.f; if (!f) return;
    if (f === "glu-v") { S.gluDraft = t.value; return; }
    if (f === "glu-t") { S.gluTime = t.value; return; }
    if (f === "pre-glu") { S.preDraft = t.value; return; }
    if (!S.canWrite) return;
    if (f === "w" || f === "r" || f === "min" || f === "km") { const row = t.closest(".set"); if (row) editSet(row, f, t.value); }
    else if (f === "sess-note") { const p = S.person, day = curDay(), path = sessPath(p, S.date, day.id), s = sessForEdit(path, p, day); s.note = t.value; s.updated = Date.now(); writeDoc(path, s, 900); }
    else if (f === "body-weight") { editDaily(S.person, S.date, d => { d.weight = parseNum(t.value); }); needsRender = true; }
    else if (f === "body-waist") { editDaily(S.person, S.date, d => { d.waist = parseNum(t.value); }); needsRender = true; }
    else if (f === "body-steps") { editDaily(S.person, S.date, d => { d.steps = parseInt0(t.value); d.stepsSrc = "manual"; }); needsRender = true; }
    else if (f.startsWith("prof-")) { const k = f.slice(5), n = k === "stepsGoal" ? parseInt0(t.value) : parseNum(t.value); if ((k === "waterGoal" || k === "bottle") && !(n > 0)) return; profileEdit(pr => { pr[k] = n; }); needsRender = true; }
    else if (f === "glu-lo" || f === "glu-hi" || f === "glu-post" || f === "glu-low") { const n = parseInt0(t.value); if (n == null || n < 20 || n > 400) return; profileEdit(pr => { pr.glu = Object.assign({}, pr.glu, { [f.slice(4)]: n }); }); needsRender = true; }
    else if (f.startsWith("sp-") && t.tagName === "INPUT" && t.type !== "checkbox") suppField(t);
    else if (f.startsWith("rt-") && t.tagName !== "SELECT") editRoutineField(t);
  });
  app.addEventListener("submit", e => {
    if (e.target.id !== "login-form") return;
    e.preventDefault();
    const email = $("#lg-email").value.trim(), pass = $("#lg-pass").value;
    if (!email || !pass) { S.loginEmail = email; S.loginErr = "Completá el mail y la contraseña."; render(); return; }
    login(email, pass);
  });
  app.addEventListener("change", e => {
    const t = e.target, f = t.dataset.f; if (!f) return;
    if (f === "import") {
      const file = t.files && t.files[0]; t.value = ""; if (!file) return;
      file.text().then(txt => { const o = JSON.parse(txt); importDocs(o && o.docs ? o.docs : o); }).catch(() => toast("No se pudo leer el archivo"));
      return;
    }
    if (f === "date") { if (t.value && t.value <= today()) { S.date = t.value; S.slide = 0; } t.blur(); render(); }
    else if (f === "prog-ex") { S.progEx[S.person] = t.value; t.blur(); render(); }
    else if (!S.canWrite) return;
    else if (f === "glu-on") { profileEdit(pr => { pr.glucose = t.checked; }); render(); }
    else if (f === "sp-active" || f === "sp-when") { suppField(t); t.blur(); render(); }
    else if (f.startsWith("rt-") && t.tagName === "SELECT") { editRoutineField(t); t.blur(); render(); }
    else needsRender = true;
  });
  app.addEventListener("focusout", () => setTimeout(() => { if (needsRender && !isEditing()) { needsRender = false; scheduleRender(); } }, 150));
  view().addEventListener("toggle", e => { const d = e.target; if (d.matches && d.matches("details[data-day]")) { if (d.open) S.openDays.add(d.dataset.day); else S.openDays.delete(d.dataset.day); } }, true);
  view().addEventListener("scroll", e => {
    if (e.target.id !== "slides") return;
    const sl = e.target, i = Math.round(sl.scrollLeft / (sl.clientWidth || 1));
    if (i !== S.slide) { S.slide = i; document.querySelectorAll("#dots i").forEach((d, k) => d.classList.toggle("on", k === i)); }
  }, true);
  let rz = null;
  window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (S.tab === "prog" || S.tab === "home") scheduleRender(); }, 200); });
  window.addEventListener("hashchange", applyHash);
}

/* ---------- Inicio ---------- */
function boot() {
  loadUI(); S.docs = lsLoad(); bind(); render(); applyHash();
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; scheduleRender(); });
  window.addEventListener("appinstalled", () => { installEvt = null; scheduleRender(); });
  window.addEventListener("online", () => sync());
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    sync();
    if (S.awaitSteps && S.mode !== "login") { S.awaitSteps = false; S.sheet = "steps"; renderSheet(); setTimeout(() => { const f = $("#b-steps"); if (f) { f.focus(); f.select(); } }, 150); }
  });
  if (!CFG.supabaseUrl || !CFG.supabaseAnonKey || !window.supabase) {
    S.mode = "local"; render();
    if (pendingHash) { const h = pendingHash; pendingHash = null; applyHashData(h); }
    return;
  }
  SB = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "gym-de-a-dos:auth" } });
  SB.auth.onAuthStateChange((ev, session) => {
    S.userEmail = session && session.user ? session.user.email : "";
    if (ev === "SIGNED_OUT") { if (channel) { SB.removeChannel(channel); channel = null; } S.mode = "login"; render(); }
  });
  SB.auth.getSession().then(({ data }) => { if (data && data.session) { S.userEmail = data.session.user.email; startDb(); } else { S.mode = "login"; render(); } })
    .catch(() => { S.mode = "login"; render(); });
}
function startDb() { S.mode = "db"; S.loginErr = ""; S.err = null; S.loaded = new Set(); render(); listen(); sync(); }
async function login(email, pass) {
  S.loginEmail = email; S.loginBusy = true; S.loginErr = ""; render();
  let r; try { r = await SB.auth.signInWithPassword({ email, password: pass }); } catch (e) { r = { error: { message: String(e) } }; }
  S.loginBusy = false;
  if (r.error) { S.loginErr = !navigator.onLine || /fetch|network/i.test(r.error.message || "") ? "No hay conexión. Probá de nuevo cuando tengas señal." : "El mail o la contraseña no coinciden."; render(); return; }
  S.userEmail = email; startDb();
}
if ("serviceWorker" in navigator && location.protocol !== "file:") window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
boot();
})();
</script>
